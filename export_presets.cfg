; Export settings for the downloadable game (tools/make_builds.sh uses them).
; macOS: one .app for Apple Silicon and Intel Macs, zipped; signed "ad hoc" only
; (no Apple Developer account), so players open it the first time with
; right-click > Open, or System Settings > Privacy & Security > Open Anyway.
; Windows: one 64-bit .exe with the game packed inside, zipped.
; Left out of both: the dev tools, docs, screenshots and the old maps.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="map/menlo_park_map.json, examples/*.json"
exclude_filter="tools/*, docs/*, screenshots/*, map/.terrain_cache/*, map/palo_alto_map.json, map/troon_map.json, *.md"
export_path="builds/Silicon City.zip"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=1
binary_format/architecture="universal"
application/icon=""
application/bundle_identifier="io.github.samdickie.siliconcity"
application/signature=""
application/app_category="Simulation-games"
application/short_version="0.2"
application/version="0.2"
application/copyright="Sam Dickie"
application/min_macos_version_x86_64="10.15"
application/min_macos_version_arm64="11.00"
display/high_res=true
codesign/codesign=1
notarization/notarization=0

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="map/menlo_park_map.json, examples/*.json"
exclude_filter="tools/*, docs/*, screenshots/*, map/.terrain_cache/*, map/palo_alto_map.json, map/troon_map.json, *.md"
export_path="builds/windows/Silicon City.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/file_version="0.2.0.0"
application/product_version="0.2.0.0"
application/company_name="Sam Dickie"
application/product_name="Silicon City"
application/file_description="Silicon City"
application/copyright="Sam Dickie"
